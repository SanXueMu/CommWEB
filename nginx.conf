# CommWEB 生产 nginx：静态托管 + /api 同源反代 CommAND（SSE 透传）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback（BrowserRouter 前端路由刷新不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代 → command-api 容器（pgnet 网络容器名直连）
    # SSE（/api/tasks/{handle}/events）需：HTTP/1.1 + 空闲连接 + 关缓冲
    location /api/ {
        proxy_pass http://command-api:8800;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
